<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vaibhav Deori">
  <rect width="1200" height="300" rx="16" fill="#0d1117"/>
  <rect x="60" y="86" width="0" height="7" rx="3.5" fill="#58a6ff">
    <animate attributeName="width" values="0;72" dur="0.6s" begin="0s" fill="freeze"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.1s" fill="freeze"/>
    <text x="60" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="#e6edf3">Vaibhav Deori</text>
  </g>
  <text x="60" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" repeatCount="indefinite"/>builds llm agents that plan and self-review</text>
  <text x="60" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>runs them on local models, no api bills</text>
  <text x="60" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.70;0.95;0.99;1" dur="12s" repeatCount="indefinite"/>writes the gateway that bills every token</text>
  <rect x="770" y="206" width="14" height="30" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <text x="60" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8b949e" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>github.com/DreViz · bangalore</text>
</svg>
