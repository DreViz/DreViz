    <rect x="1048" y="305" width="4" height="4" fill="#16a34a"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="1048" y="319" width="4" height="4" fill="#16a34a"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.7s" repeatCount="indefinite"/></rect>
