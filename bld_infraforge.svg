<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-label="InfraForge" shape-rendering="crispEdges">
  <rect x="6" y="6" width="588" height="438" fill="#101120"/>
  <rect width="588" height="438" fill="#1a1b2e" stroke="#30363d" stroke-width="2"/>
  <g>
    <rect x="200" y="60" width="160" height="140" fill="#64748b"/>
    <rect x="216" y="44" width="128" height="16" fill="#475569"/>
    <rect x="220" y="76" width="36" height="16" fill="#94a3b8"/>
    <rect x="304" y="76" width="36" height="16" fill="#94a3b8"/>
    <rect x="235" y="120" width="70" height="80" fill="#1c1917"/>
    <rect x="243" y="150" width="54" height="40" fill="#f97316"><animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="251" y="160" width="38" height="30" fill="#fde047"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="0" y="200" width="600" height="12" fill="#4ade80"/>
    <rect x="0" y="212" width="600" height="14" fill="#92400e"/>
  </g>
  <text x="40" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#e6edf3">InfraForge</text>
  <text x="560" y="272" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">structure 4/5</text>
  <text x="40" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-style="italic" fill="#fb923c">what if describing infra was the whole job?</text>
  <text x="40" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8b949e">Plain English to production-ready Terraform, with</text>
  <text x="40" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8b949e">diagrams, cost estimates, security audits. No account.</text>
  <rect x="40" y="396" width="110" height="26" rx="4" fill="#7c2d12"/>
  <text x="95" y="413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#fb923c">typescript</text>
  <rect x="162" y="396" width="99" height="26" rx="4" fill="#7c2d12"/>
  <text x="211" y="413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#fb923c">terraform</text>
</svg>
