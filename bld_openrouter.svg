<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-label="Open-Router" shape-rendering="crispEdges">
  <rect x="6" y="6" width="588" height="438" fill="#101120"/>
  <rect width="588" height="438" fill="#1a1b2e" stroke="#30363d" stroke-width="2"/>
  <g>
    <rect x="220" y="40" width="160" height="160" fill="#312e81"/>
    <rect x="232" y="52" width="136" height="136" fill="#60a5fa">
      <animate attributeName="fill" values="#60a5fa;#a78bfa;#60a5fa" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="200" width="600" height="12" fill="#4ade80"/>
    <rect x="0" y="212" width="600" height="14" fill="#92400e"/>
    <g fill="#e2e8f0">
      <circle cx="180" cy="120" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="90" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="160" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="70" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="40" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#e6edf3">Open-Router</text>
  <text x="560" y="272" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">structure 2/5</text>
  <text x="40" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-style="italic" fill="#60a5fa">what does a gateway owe every SDK pointed at it?</text>
  <text x="40" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8b949e">OpenAI-compatible gateway in Go: auth, rate limits,</text>
  <text x="40" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8b949e">provider routing, SSE, atomic per-token billing.</text>
  <rect x="40" y="396" width="48" height="26" rx="4" fill="#172554"/>
  <text x="64" y="413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#60a5fa">go</text>
  <rect x="100" y="396" width="108" height="26" rx="4" fill="#172554"/>
  <text x="154" y="413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#60a5fa">postgres</text>
  <rect x="220" y="396" width="99" height="26" rx="4" fill="#172554"/>
  <text x="269" y="413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#60a5fa">next.js</text>
</svg>
