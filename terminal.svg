<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-label="terminal intro">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1723"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#8b949e" opacity="0.06"/>
    </pattern>
    <filter id="tglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="545" rx="16" fill="url(#tbg)"/>
  <rect width="1200" height="56" rx="16" fill="#161b22"/>
  <rect y="28" width="1200" height="28" fill="#161b22"/>
  <circle cx="36" cy="28" r="9" fill="#ff5f56"/>
  <circle cx="66" cy="28" r="9" fill="#ffbd2e"/>
  <circle cx="96" cy="28" r="9" fill="#27c93f"/>
  <text x="600" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8b949e">vaibhav@bangalore: ~/profile</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze"/>
    <text x="50" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#3fb950" filter="url(#tglow)">$</text>
    <text x="76" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#e6edf3">whoami</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <text x="76" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#8b949e">vaibhav deori · engineer · bangalore</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
    <text x="50" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#3fb950" filter="url(#tglow)">$</text>
    <text x="76" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#e6edf3">cat focus.txt</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.4s" fill="freeze"/>
    <text x="76" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#8b949e">llm agents · local models · gateways · per-token billing</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.2s" fill="freeze"/>
    <text x="50" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#3fb950" filter="url(#tglow)">$</text>
    <text x="76" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#e6edf3">./status --now</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.8s" fill="freeze"/>
    <text x="76" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#8b949e">shipping GoodFood phase 7 · going deeper on go</text>
    <text x="76" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#8b949e">open to ai/backend roles</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.4s" fill="freeze"/>
    <text x="50" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#3fb950" filter="url(#tglow)">$</text>
    <rect x="82" y="464" width="14" height="26" fill="#e6edf3" filter="url(#tglow)">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </g>

  <line x1="0" y1="497" x2="1200" y2="497" stroke="#21262d" stroke-width="2"/>
  <circle cx="70" cy="522" r="6" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="86" y="529" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">ollama: ready</text>
  <text x="300" y="529" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">postgres: up</text>
  <text x="520" y="529" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">tokens: accounted</text>
  <text x="1150" y="529" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">bash · utf-8</text>
</svg>
