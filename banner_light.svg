<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vaibhav Deori">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c9d1d9" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <rect x="60" y="86" width="0" height="7" rx="3.5" fill="#0969da" filter="url(#glow)">
    <animate attributeName="width" values="0;72" dur="0.6s" begin="0s" fill="freeze"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.1s" fill="freeze"/>
    <text x="60" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="#1f2328">Vaibhav Deori</text>
  </g>
  <text x="60" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" repeatCount="indefinite"/>builds llm agents that plan and self-review</text>
  <text x="60" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>runs them on local models, no api bills</text>
  <text x="60" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.70;0.95;0.99;1" dur="12s" repeatCount="indefinite"/>writes the gateway that bills every token</text>
  <rect x="770" y="206" width="14" height="30" fill="#0969da" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <text x="60" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#57606a" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>github.com/DreViz · bangalore</text>

  <g>
    <line x1="1070" y1="100" x2="1000" y2="200" stroke="#d0d7de" stroke-width="2"/>
    <line x1="1070" y1="100" x2="1160" y2="200" stroke="#d0d7de" stroke-width="2"/>
    <line x1="1000" y1="200" x2="1160" y2="200" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="1070" cy="100" r="16" fill="#f6f8fa" stroke="#0969da" stroke-width="2.5">
      <animate attributeName="r" values="16;18;16" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="200" r="16" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2.5">
      <animate attributeName="r" values="16;18;16" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="200" r="16" fill="#f6f8fa" stroke="#cf222e" stroke-width="2.5">
      <animate attributeName="r" values="16;18;16" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1070" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#57606a">user</text>
    <text x="1000" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#57606a">planner</text>
    <text x="1160" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#57606a">responder</text>
    <circle r="4" fill="#0969da" filter="url(#glow)">
      <animateMotion path="M1070,100 L1000,200" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#0969da" filter="url(#glow)">
      <animateMotion path="M1070,100 L1160,200" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#1a7f37" filter="url(#glow)">
      <animateMotion path="M1000,200 L1160,200" dur="2s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
