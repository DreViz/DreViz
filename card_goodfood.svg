<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="GoodFood project card">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1723"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#cbg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="40" y="40" width="56" height="6" rx="3" fill="#3fb950"/>
  <text x="40" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#e6edf3">GoodFood</text>
  <text x="560" y="102" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#3fb950">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.5s" repeatCount="indefinite"/>↗</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <text x="40" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-style="italic" fill="#3fb950">how small can a model be</text>
    <text x="40" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-style="italic" fill="#3fb950">before an agent breaks?</text>
  </g>
  <text x="40" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8b949e">Two-agent concierge: a Planner emits</text>
  <text x="40" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8b949e">strict JSON, a Responder speaks human.</text>
  <rect x="40" y="316" width="89" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <text x="84" y="334" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#79c0ff">python</text>
  <rect x="141" y="316" width="99" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <text x="190" y="334" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#79c0ff">fastapi</text>
  <rect x="252" y="316" width="99" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <text x="301" y="334" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#79c0ff">next.js</text>
  <rect x="363" y="316" width="89" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <text x="407" y="334" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#79c0ff">ollama</text>
</svg>
